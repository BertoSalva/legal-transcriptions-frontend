<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Light background -->
  <rect width="64" height="64" fill="#e8f3f4"/>
  
  <!-- Top decorative line -->
  <line x1="10" y1="12" x2="52" y2="12" stroke="#0f8b8d" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- K letter - geometric line design -->
  <g stroke="#0f8b8d" stroke-width="2.4" stroke-linecap="round" fill="none" stroke-linejoin="round">
    <!-- Vertical line -->
    <line x1="20" y1="20" x2="20" y2="52"/>
    <!-- Top diagonal -->
    <line x1="20" y1="24" x2="40" y2="12"/>
    <!-- Bottom diagonal -->
    <line x1="20" y1="40" x2="44" y2="54"/>
  </g>
</svg>